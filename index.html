<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ореховый патруль</title>
<meta name="description" content="Математика 5 класса (Петерсон) в игре с бурундуками Фундуком и Миндалинкой">
<meta name="theme-color" content="#F3A23F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Орех-патруль">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<!-- Заглушка загрузки: свои стили прямо здесь, чтобы она была видна, даже если css/style.css не пришёл -->
<style>
  #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center; background: #FFF3DE; color: #4A2814; font: 600 20px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #boot .nut { font-size: 64px; animation: bootbob 1.2s ease-in-out infinite; }
  #boot .sub { font-size: 16px; font-weight: 500; opacity: .75; max-width: 320px; }
  #boot button { font: 700 20px system-ui, sans-serif; color: #fff; background: #5E9E4A; border: 0; border-radius: 16px; padding: 14px 34px;
    box-shadow: 0 5px 0 #3F7432; cursor: pointer; }
  @keyframes bootbob { 50% { transform: translateY(-8px) rotate(-8deg); } }
  @media (prefers-reduced-motion: reduce) { #boot .nut { animation: none; } }
</style>
</head>
<body>
<div id="boot" role="status"><div class="nut">🌰</div><div>Загружаем лес…</div></div>
<script>
  /* Белого экрана не бывает: если за 8 секунд игра не стартовала или скрипт упал — «Нет связи» и «Повторить» */
  (function () {
    var shown = false;
    function fail(why) {
      if (window.OREH_READY || shown) return; shown = true;
      var b = document.getElementById('boot'); if (!b) return;
      b.innerHTML = '<div class="nut" style="animation:none">🍂</div><div>' + (why === 'err' ? 'Игра не загрузилась' : 'Нет связи с сервером') + '</div>' +
        '<div class="sub">Проверьте интернет: можно переключиться с Wi‑Fi на мобильный или наоборот.</div>' +
        '<button type="button" onclick="location.reload()">Повторить</button>';
    }
    window.OREH_FAIL = fail;
    setTimeout(fail, 8000);
    window.addEventListener('error', function (e) { if (!window.OREH_READY && (!e.target || e.target === window || e.target.tagName === 'SCRIPT')) setTimeout(function () { fail('err'); }, 50); }, true);
  })();
</script>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="js/core.js"></script>
<script src="js/t-fund.js"></script>
<script src="js/t-lang.js"></script>
<script src="js/t-models.js"></script>
<script src="js/t-logic.js"></script>
<script src="js/t-div.js"></script>
<script src="js/topics.js"></script>
<script src="js/art.js"></script>
<script src="js/state.js"></script>
<script src="js/cloud.js"></script>
<script src="js/ui.js"></script>
<script src="js/play.js"></script>
<script src="js/screens.js"></script>
<script src="js/kid.js"></script>
<script>
  (function () {
    function ready() { window.OREH_READY = true; var bt = document.getElementById('boot'); if (bt) bt.remove(); }
    try { boot(); ready(); }
    catch (e) {
      /* Запасной путь: экран «Кто играет?», чтобы можно было выбрать игрока */
      try { showWho(); ready(); } catch (e2) { if (window.OREH_FAIL) window.OREH_FAIL('err'); }
    }
    try { Cloud.start(); } catch (e) { }
  })();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
