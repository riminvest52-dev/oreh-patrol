<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#FFE29A 0%,#F9B04A 52%,#E2702A 100%)}
.ring{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle,#FFF4DC 0%,#FFE6B8 70%,rgba(255,230,184,0) 71%)}
svg.chip{position:absolute;left:10%;top:9%;width:80%;height:97.7%}
.acorn{position:absolute;right:9%;bottom:8%;width:22%;height:22%}
.leaf{position:absolute;left:8%;bottom:10%;width:16%;height:16%}
</style></head><body><div class="bg"></div><div class="ring"></div><div id="c"></div>
<script src="../js/art.js"></script>
<script>
document.getElementById('c').innerHTML = ART.chip('funduk', 'cheer').replace('viewBox="0 0 200 215"', 'viewBox="12 0 176 215"') +
  ART.acorn(100).replace('class="acorn" width="100" height="100"', 'class="acorn"') +
  '<svg class="leaf" viewBox="-10 -10 20 20"><path d="M0 -8 Q7 -4 6 4 Q0 9 -6 4 Q-7 -4 0 -8Z" fill="#C9532A" transform="rotate(-30)"/></svg>';
</script></body></html>
