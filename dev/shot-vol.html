<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Объёмная мастерская — скриншоты</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<!-- Только для проверки раскладки. ?s=map|topic|parent|task; для task: &g=vol_count&d=1..3&seed=N&a=ok|bad -->
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
  /* Повторяемые задания: одинаковый seed — одинаковое задание */
  (function () { const q = new URLSearchParams(location.search); let a = +(q.get('seed') || 1) >>> 0;
    Math.random = function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
</script>
<script src="../js/core.js"></script>
<script src="../js/t-fund.js"></script>
<script src="../js/t-lang.js"></script>
<script src="../js/t-models.js"></script>
<script src="../js/t-logic.js"></script>
<script src="../js/t-div.js"></script>
<script src="../js/topics.js"></script>
<script src="../js/art.js"></script><script src="../js/art2.js"></script>
<script src="../js/state.js"></script>
<script src="../js/cloud.js"></script>
<script src="../js/ui.js"></script><script>var VOICE_BASE = "../";</script><script src="../js/voice-data.js"></script><script src="../js/voice.js"></script>
<script src="../js/play.js"></script>
<script src="../js/t-vol.js"></script>
<script src="../js/screens.js"></script>
<script src="../js/kid.js"></script><script src="../js/k-path.js"></script>
<script>
  try { localStorage.setItem('oreh_voice', '0'); } catch (e) { }
  const fp = F.profiles.find(p => p.world === 'five');
  if (fp) useProfile(fp.id); else addProfile('five');
  S.name = 'Настя'; S.sound = false;
  const q = new URLSearchParams(location.search), s = q.get('s') || 'task';
  if (q.get('hand')) { S.hands = {}; const { wk, h } = handsWeek(); S.hands[wk] = { id: h.id, st: q.get('hand'), ts: Date.now() }; }
  save();
  if (s === 'map') showMap();
  else if (s === 'topic') showTopic('vol');
  else if (s === 'parent') showParent();
  else {
    begin({ mode: 'level', topic: 'vol', level: +(q.get('d') || 1), title: 'Объёмная мастерская', queue: [{ gen: q.get('g') || 'vol_count', d: +(q.get('d') || 1) }, { gen: 'vol_calc', d: 1 }] });
    if (q.get('build')) { let b; do { b = makeTask('vol_view', 3); } while (b.type !== 'build'); SES.task = b; renderTask(); }
    const t = SES.task, a = q.get('a');
    if (a) {
      const ok = a === 'ok'; SES.tries = ok ? 0 : 1;   /* ошибка — сразу итог, без второй попытки */
      if (t.type === 'num') { SES.input = String(ok ? t.answer : t.answer + 1); document.getElementById('disp').textContent = fmt(+SES.input); ACT.check(); }
      else if (t.type === 'build') { SES.bh = ok ? t.sol : t.sol.map(r => r.map(() => 1)); ACT.check(); }
      else { const i = t.options.findIndex(o => ok ? o === t.answer : o !== t.answer); ACT.pick({ dataset: { i } }); }
    }
  }
</script>
</body>
</html>
