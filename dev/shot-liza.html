     Игрок — отдельный тестовый профиль «Лиза» этого браузера (localhost), настоящий прогресс не трогается. -->

<script>for (const f of ['k-shop', 'k-house']) document.write(`<script src="../js/${f}.js" onerror="this.remove()"><\/script>`);</script>
<script>
  try { localStorage.setItem('oreh_voice', '0'); } catch (e) { }
  const kp = F.profiles.find(p => p.world === 'kid');
  if (kp) useProfile(kp.id); else addProfile('kid');
  /* Как у Лизы сейчас: все уголки на три звезды, около 340 орешков */
  S.name = 'Лиза'; S.sound = false;
  for (const T of KID_TOPICS) S.stars[T.id] = 3;
  S.stars['k_cnt#2'] = 2; S.stars['k_add#2'] = 3; S.medals['k_add#2'] = '2026-11-15'; S.stars['k_line#2'] = 1;
  S.acorns = 340; S.earned = Math.max(S.earned, 340 + S.stickers.reduce((s, i) => s + STICKERS[i][2], 0));
  save();
  const q = new URLSearchParams(location.search), s = q.get('s') || 'map', g = q.get('g'), d = +(q.get('d') || 1);
  const task = (tid, gen, lev, step = 2) => { kidStart(tid, step); K.queue[0] = gen; K.d = lev; kidNext(); };
  const tidOf = gen => Object.keys(KID_STEP2).find(t => KID_STEP2[t].gens.includes(gen)) || KID_TOPICS.find(T => T.gens.includes(gen)).id;
  if (s === 'map') showKidMap();
  if (s === 'pick') { showKidMap(); kidStepPick('k_cnt'); }
  if (s === 'task') task(tidOf(g), g, d);
  if (s === 'medal') { S.stars['k_cnt#2'] = 2; delete S.medals['k_cnt#2']; kidStart('k_cnt', 2); K.first = 6; K.acorns = 6; K.i = K.queue.length; kidNext(); }
  if (window.SHOT_EXTRA) SHOT_EXTRA(s, q);
</script>
