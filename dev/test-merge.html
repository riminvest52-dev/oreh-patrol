<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Тест слияния прогресса</title>
<style>body{font:15px system-ui;padding:16px} .bad{color:#b00} .ok{color:#080}</style></head>
<body>
<h2>Тест слияния прогресса</h2>
<pre id="out"></pre>
<script src="../js/core.js"></script>
<script src="../js/state.js"></script>
<script>const ACT = {};</script>
<script src="../js/mult.js"></script>
<script>
'use strict';
const log = [], results = { pass: 0, fail: 0 };
function check(name, cond, extra) {
  if (cond) results.pass++; else { results.fail++; log.push('ПРОВАЛ: ' + name + (extra !== undefined ? ' -> ' + JSON.stringify(extra) : '')); }
}
const dev = name => (st, f) => { f(st); st._ts = Date.now() + Math.random(); tallyFor(st, name); return st; };
const earn = (st, n) => { st.acorns += n; st.earned += n; };
const answer = (st, ok) => { st.solved++; if (ok) st.right++; };
const clone = o => JSON.parse(JSON.stringify(o));
const synced = o => { const c = clone(o); delete c.sound; return JSON.stringify(canon(c)); };
const A = dev('A'), B = dev('B'), C = dev('C');

/* База: общий прогресс двух устройств */
function base() {
  const s = fresh(); s.name = 'Тест';
  A(s, x => { earn(x, 100); answer(x, true); answer(x, false); x.stars['fund:1'] = 2; });
  return s;
}

{ /* заработанное складывается и не удваивается */
  const a = base(), b = clone(a);
  A(a, x => earn(x, 10)); B(b, x => earn(x, 5));
  const m = mergeStates(a, b);
  check('earned складывается', m.earned === 115, m.earned);
  check('acorns складывается', m.acorns === 115, m.acorns);
  const m2 = mergeStates(mergeStates(m, a), b);
  check('повторное слияние не удваивает', m2.earned === 115, m2.earned);
  check('идемпотентность', synced(mergeStates(m, m)) === synced(m));
  check('слияние с собой', mergeStates(a, a).earned === a.earned);
}
{ /* наклейки */
  const a = base(), b = clone(a);
  A(a, x => { x.acorns -= STICKERS[0][2]; x.stickers.push(0); });
  B(b, x => { x.acorns -= STICKERS[1][2]; x.stickers.push(1); });
  const m = mergeStates(a, b);
  check('наклейки объединились', m.stickers.join() === '0,1', m.stickers);
  check('цена обеих вычтена', m.acorns === 100 - STICKERS[0][2] - STICKERS[1][2], m.acorns);
}
{ /* звёзды, медали */
  const a = base(), b = clone(a);
  A(a, x => { x.stars['fund:1'] = 3; x.stars['fund:2'] = 1; }); B(b, x => { x.stars['fund:2'] = 3; x.medals.fund = true; });
  const m = mergeStates(a, b);
  check('лучшие звёзды', m.stars['fund:1'] === 3 && m.stars['fund:2'] === 3, m.stars);
  check('медаль сохранена', m.medals.fund === true);
}
{ /* решённая ошибка не возвращается */
  const a = base(); a.mistakes.push({ id: 'm1', gen: 'g', d: 1, topic: 'fund', box: 3, due: '2026-01-01', ts: 5 });
  const b = clone(a);
  A(a, x => { x.gone.m1 = 10; x.mistakes = []; });
  const m = mergeStates(b, a), m2 = mergeStates(m, b);
  check('решённая ошибка не вернулась', m.mistakes.length === 0 && m2.mistakes.length === 0, m2.mistakes);
}
{ /* ошибка: одна задача с двух устройств хранится один раз, берётся свежая */
  const a = base(), b = clone(a);
  a.mistakes.push({ id: 'a', gen: 'g', d: 2, box: 1, ts: 5 }); b.mistakes.push({ id: 'b', gen: 'g', d: 2, box: 2, ts: 9 });
  const m = mergeStates(a, b);
  check('без дублей', m.mistakes.length === 1 && m.mistakes[0].id === 'b', m.mistakes);
}
{ /* сброс на одном устройстве побеждает старый прогресс на другом */
  const a = base(), b = clone(a);
  const r = Object.assign(fresh(), { name: a.name, _epoch: 1 });
  check('сброс побеждает', mergeStates(b, r).earned === 0 && mergeStates(r, b).earned === 0);
  check('новая эпоха сохраняется', mergeStates(b, r)._epoch === 1);
}
{ /* файл первой версии: счётчиков по устройствам ещё нет */
  const old = { name: 'Старый', acorns: 30, earned: 40, solved: 12, right: 9, stickers: [0], stars: { 'x:1': 3 } };
  const m = mergeStates(fresh(), old);
  check('старые данные сохранены', m.solved === 12 && m.right === 9 && m.earned === 40 && m.name === 'Старый', m);
  check('орехи старых данных', m.acorns === 40 - STICKERS[0][2], m.acorns);
}
{ /* серия дней через два устройства */
  const a = base(), b = clone(a), d = n => addDays('2026-11-09', n);
  [-3, -2, -1].forEach(n => a.history[d(n)] = { n: 3, ok: 2 });
  a.streak = { last: d(-1), count: 3, best: 3 };
  b.history[d(0)] = { n: 1, ok: 1 }; b.streak = { last: d(0), count: 1, best: 1 };
  const m = mergeStates(a, b);
  check('серия продолжается', m.streak.count === 4 && m.streak.last === d(0) && m.streak.best === 4, m.streak);
}
{ /* имя берётся из более свежих данных */
  const a = base(), b = clone(a); a._ts = 100; b._ts = 200; b.name = 'Новое';
  check('свежее имя', mergeStates(a, b).name === 'Новое' && mergeStates(b, a).name === 'Новое');
}
{ /* звук — настройка устройства */
  const a = base(), b = clone(a); a.sound = false; b.sound = true;
  check('звук не перезаписан', mergeStates(a, b).sound === false);
}

/* Случайная игра на трёх устройствах с синхронизацией через «облако» */
for (let run = 0; run < 400; run++) {
  const names = ['A', 'B', 'C'], devs = {}, expect = { solved: 0, right: 0, earned: 0 }, bought = new Set();
  let cloud = null;
  names.forEach(n => devs[n] = Object.assign(fresh(), { name: 'Игрок' }));
  const syncDev = n => { if (cloud) devs[n] = mergeStates(devs[n], cloud); cloud = clone(devs[n]); };
  for (let step = 0; step < 60; step++) {
    const n = names[Math.floor(Math.random() * 3)], st = devs[n], r = Math.random();
    if (r < 0.45) { const ok = Math.random() < 0.7; st.solved++; expect.solved++; if (ok) { st.right++; expect.right++; } }
    else if (r < 0.7) { const k = 1 + Math.floor(Math.random() * 5); st.acorns += k; st.earned += k; expect.earned += k; }
    else if (r < 0.8) { const i = Math.floor(Math.random() * STICKERS.length); if (!st.stickers.includes(i)) { st.stickers.push(i); st.acorns -= STICKERS[i][2]; bought.add(i); } }
    else { syncDev(n); continue; }
    st._ts = step + 1; tallyFor(st, n);
  }
  /* Два круга: после них все устройства должны видеть одно и то же */
  for (let k = 0; k < 2; k++) names.forEach(syncDev);
  const first = devs.A;
  check('все сошлись', names.every(n => synced(devs[n]) === synced(first)), run);
  check('ни одного решения не потеряно', first.solved === expect.solved && first.right === expect.right, [first.solved, expect.solved]);
  check('ни одного ореха не потеряно', first.earned === expect.earned, [first.earned, expect.earned]);
  check('наклейки все', first.stickers.length === bought.size, [first.stickers, [...bought]]);
  const spent = first.stickers.reduce((s, i) => s + STICKERS[i][2], 0);
  check('орехи = заработано − потрачено', first.acorns === Math.max(0, first.earned - spent), first.acorns);
}

/* ---------- Семейный кабинет: восстановление, удаление и отмена (данные устройства на время теста откладываем) ---------- */
{
  const keepLS = Object.assign({}, localStorage), keepF = F, keepS = S;
  try {
    const st = (n, ep = 0) => Object.assign(fresh(), { name: 'Тест', earned: n, acorns: n, _epoch: ep, _ts: 1000 + n, _tally: { X: { earned: n, solved: 0, right: 0 } } });
    F = { v: 2, device: 'dT', code: null, lastSync: 0, profiles: [{ id: 'p1', world: 'five', hero: 'mindal' }], current: 'p1' };
    S = st(50); writeJson(profKey('p1'), S);
    const n = restoreDoc({ v: 2, profiles: [{ id: 'p1', world: 'five', hero: 'mindal' }], states: { p1: st(20) } });
    check('восстановлен один игрок', n === 1, n);
    check('прогресс как в копии', S.earned === 20 && S.acorns === 20, [S.earned, S.acorns]);
    check('копия получила новую эпоху', S._epoch === 1, S._epoch);
    const stale = st(60);   /* другое устройство ещё со старыми данными */
    check('копия побеждает старые данные других устройств', mergeStates(stale, S).earned === 20 && mergeStates(S, stale).earned === 20);
    let bad = false; try { restoreDoc({ v: 2, profiles: [], states: {} }); } catch (e) { bad = true; }
    check('пустая копия не принимается', bad);

    F.profiles.push({ id: 'p2', world: 'kid', hero: 'zhel' }); writeJson(profKey('p2'), st(5));
    const remoteOld = JSON.parse(JSON.stringify(F.profiles[0]));
    deleteProfile('p1');
    check('удалённого не видно', liveProfiles().length === 1 && liveProfiles()[0].id === 'p2');
    check('текущим стал другой игрок', F.current === 'p2', F.current);
    check('удаление побеждает старую запись с другого устройства', !!newerProfile(F.profiles[0], remoteOld).del);
    const remoteDel = JSON.parse(JSON.stringify(F.profiles[0]));
    F.profiles[0].ch = Date.now() - 5; undeleteProfile('p1');
    check('отмена удаления', liveProfiles().length === 2 && !F.profiles[0].del);
    check('отмена побеждает запись «удалён»', !newerProfile(F.profiles[0], remoteDel).del);
    check('данные вернулись вместе с игроком', readProfile('p1').earned === 20);
    deleteProfile('p1'); F.profiles[0].del = Date.now() - 29 * 864e5; purgeProfiles();
    check('29 дней — ещё можно вернуть', !F.profiles[0].gone && !!readProfile('p1'));
    F.profiles[0].del = Date.now() - 31 * 864e5; purgeProfiles();
    check('через 30 дней удалён насовсем', F.profiles[0].gone === 1 && !readProfile('p1'));
    undeleteProfile('p1');
    check('удалённого насовсем не вернуть', !!F.profiles[0].del);
  } finally {
    localStorage.clear(); for (const k in keepLS) localStorage.setItem(k, keepLS[k]);
    F = keepF; S = keepS;
  }
}

/* ---------- Тренажёр таблицы умножения (js/mult.js) ---------- */
{
  const D0 = '2026-03-02', d = n => addDays(D0, n);
  /* Интервалы повторения: 1, 3, 7, 14 дней; ошибка — снова в ежедневную коробку */
  let st = fresh(), r;
  r = mulAnswer(st, 7, 8, true, 2000, d(0));
  check('первый верный ответ: коробка 1, повтор завтра', r.b === 1 && r.due === d(1), r);
  r = mulAnswer(st, 7, 8, true, 2000, d(0));
  check('повторный ответ в тот же день коробку не двигает', r.b === 1 && r.due === d(1), r);
  r = mulAnswer(st, 7, 8, true, 2000, d(1));
  check('через 1 день → следующий показ через 3 дня', r.b === 2 && r.due === d(4), r);
  r = mulAnswer(st, 7, 8, true, 2000, d(4));
  check('→ через 7 дней', r.b === 3 && r.due === d(11), r);
  r = mulAnswer(st, 7, 8, true, 2000, d(11));
  check('→ через 14 дней', r.b === 4 && r.due === d(25), r);
  r = mulAnswer(st, 7, 8, true, 2000, d(25));
  check('дальше — каждые 14 дней', r.b === 4 && r.due === d(39), r);
  r = mulAnswer(st, 7, 8, false, 2000, d(30));
  check('ошибка → ежедневная коробка, повторить сегодня', r.b === 0 && r.due === d(30) && r.r.length === 0, r);
  check('ошибка: пример «пора повторить»', mulDue(r, d(30)));
  r = mulAnswer(st, 7, 8, true, 2000, d(30));
  check('после ошибки верно → снова через 1 день', r.b === 1 && r.due === d(31), r);

  /* «Выучен» — 3 быстрых верных ответа с первой попытки в разные дни */
  st = fresh();
  for (let i = 0; i < 3; i++) mulAnswer(st, 6, 7, true, 1500, d(0));
  check('3 верных в один день — ещё «учится»', mulStatus(mulRec(st, 6, 7)) === 'learn', mulRec(st, 6, 7));
  mulAnswer(st, 6, 7, true, 1500, d(1));
  mulAnswer(st, 6, 7, true, 6500, d(2));
  check('медленный ответ (больше 5 с) не засчитан', mulStatus(mulRec(st, 6, 7)) === 'learn' && mulRec(st, 6, 7).r.length === 2);
  mulAnswer(st, 6, 7, true, 4800, d(3));
  check('3 разных дня, каждый не дольше 5 с → «знает»', mulStatus(mulRec(st, 6, 7)) === 'know', mulRec(st, 6, 7));
  mulAnswer(st, 6, 7, false, 1000, d(4));
  check('ошибка — серия начинается заново', mulStatus(mulRec(st, 6, 7)) === 'learn' && mulRec(st, 6, 7).r.length === 0);
  st = fresh();
  [2500, 2500, 2500, 2800, 2900].forEach((ms, i) => mulAnswer(st, 9, 9, true, ms, d(i)));
  check('5 быстрых в разные дни, последние 2 до 3 с → «золотой»', mulStatus(mulRec(st, 9, 9)) === 'gold', mulRec(st, 9, 9));
  st = fresh();
  [2500, 2500, 2500, 4000, 2900].forEach((ms, i) => mulAnswer(st, 9, 9, true, ms, d(i)));
  check('предпоследний 4 с → ещё не золотой', mulStatus(mulRec(st, 9, 9)) === 'know');
  check('не встречался → серый', mulStatus(mulRec(st, 2, 2)) === 'none');

  /* Подбор примеров: 70% «на подходе» + 30% выученных */
  st = fresh(); st.mulCols = { 2: 1, 3: 1, 4: 1, 5: 1 };
  for (const b of MUL_NUMS) for (let i = 0; i < 3; i++) { mulAnswer(st, 2, b, true, 1000, d(i)); mulAnswer(st, 3, b, true, 1000, d(i)); }
  const pick = mulPick(st, 20, d(3));
  const nk = pick.filter(([a, b]) => mulKnown(mulRec(st, a, b))).length;
  check('в тренировке 20 примеров', pick.length === 20, pick.length);
  check('выученных для повторения — 30% (6 из 20)', nk === 6, nk);
  check('все примеры — из изученных столбиков', pick.every(([a, b]) => [2, 3, 4, 5].includes(a) || [2, 3, 4, 5].includes(b)));
  const due = fresh(); due.mulCols = { 7: 1 };
  mulAnswer(due, 7, 6, false, 1000, d(0));
  check('ошибочный пример попадает в следующую тренировку первым делом', mulPick(due, 3, d(1)).some(([a, b]) => a === 7 && b === 6));
  check('нет изученных столбиков — нечего давать', mulPick(fresh(), 20).length === 0);

  /* Подсказки-способы и задания сходятся с ответом */
  let bad = [];
  for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) {
    const w = mulWay(a, b);
    if (!new RegExp('(^|\\D)' + a * b + '\\.$').test(w)) bad.push([a, b, w]);
    for (const k of ['mul', 'div', 'miss']) {
      const t = mulTask(k, a, b), c = a * b;
      const okv = k === 'mul' ? t.ans === c : k === 'div' ? t.ans * a === c : t.ans * b === c;
      if (!okv || !/\?/.test(t.q)) bad.push([k, a, b, t.q, t.ans]);
    }
  }
  check('способ в подсказке приводит к верному ответу (100 примеров × 3 вида)', !bad.length, bad.slice(0, 3));
  check('×9: от ×10 отнять', mulWay(9, 7).includes('70 − 7 = 63'), mulWay(9, 7));
  check('×6, ×7, ×8 — через соседний пример', mulWay(7, 8).includes('7 · 7 = 49') && mulWay(7, 8).includes('49 + 7 = 56'), mulWay(7, 8));
  check('перестановка множителей', mulWay(2, 8).startsWith('Поменяй множители местами'), mulWay(2, 8));

  /* Слияние прогресса таблицы между устройствами */
  const s0 = fresh(); s0.name = 'Тест';
  const a = clone(s0), b = clone(s0);
  A(a, x => { mulAnswer(x, 7, 8, true, 2000, d(0)); x.mulCols[7] = 1; x.mulBest = 12; });
  B(b, x => { mulAnswer(x, 6, 9, false, 2000, d(0)); x.mulCols[6] = 1; x.mulBest = 15; });
  const m = mergeStates(a, b);
  check('примеры с обоих устройств сохранились', !!m.mul['7x8'] && !!m.mul['6x9'], Object.keys(m.mul));
  check('изученные столбики объединились', m.mulCols[7] && m.mulCols[6]);
  check('рекорд разминки — лучший', m.mulBest === 15, m.mulBest);
  const a2 = clone(m), b2 = clone(m);
  A(a2, x => { x.mul['7x8'].ts = 1000; });
  B(b2, x => { mulAnswer(x, 7, 8, false, 2000, d(1)); });
  const m2 = mergeStates(a2, b2);
  check('по одному примеру побеждает более свежий ответ', m2.mul['7x8'].e === 1 && m2.mul['7x8'].b === 0, m2.mul['7x8']);
  check('слияние повторно ничего не меняет', synced(mergeStates(m2, m2)) === synced(m2) && synced(mergeStates(m2, a2)) === synced(mergeStates(m2, a2)));
  check('старое устройство без таблицы не стирает её', Object.keys(mergeStates(m, Object.assign(clone(s0), { mul: undefined })).mul).length === 2);
  check('мир «4 класс» есть среди миров', WORLDS.four && WORLDS.four.title === '4 класс' && Object.keys(WORLDS).join() === 'kid,four,five');
}

/* ---------- Облако: та же логика, что в облачной функции (нужен запущенный dev/kv_server.py) ---------- */
async function serverTests() {
  const URL = 'http://127.0.0.1:8766';
  const post = async b => { const r = await fetch(URL, { method: 'POST', body: JSON.stringify(b) }); return Object.assign({ status: r.status }, await r.json()); };
  try { await post({ op: 'dev_wipe' }); } catch (e) { log.push('ПРОПУЩЕНО: облако на компьютере не запущено (python dev/kv_server.py)'); results.skip = 1; return; }
  const hex = () => Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2, '0')).join('');
  const key = hex(), doc = n => ({ v: 2, profiles: [{ id: 'p1', world: 'five' }], states: { p1: Object.assign(fresh(), { name: 'Тест', earned: n, acorns: n }) }, devices: {} });
  let r = await post({ op: 'get', key, _ip: '10.1.1.1' });
  check('новой семьи ещё нет', r.status === 200 && r.doc === null, r);
  await post({ op: 'put', key, doc: doc(10) }); await post({ op: 'put', key, doc: doc(20) });
  r = await post({ op: 'get', key }); check('сохранено последнее', r.doc.states.p1.earned === 20);
  r = await post({ op: 'backups', key }); check('предыдущая версия хранится', r.list.length === 1 && r.list[0].id === 'prev', r.list);
  r = await post({ op: 'backup', key, id: 'prev' }); check('предыдущая = 10', r.doc.states.p1.earned === 10);
  await post({ op: 'dev_shift', days: 1 }); await post({ op: 'put', key, doc: doc(30) });
  await post({ op: 'dev_shift', days: 1 }); await post({ op: 'put', key, doc: doc(40) });
  r = await post({ op: 'backups', key }); const days = r.list.filter(b => b.id !== 'prev');
  check('копия на каждый день', days.length === 2, r.list);
  r = await post({ op: 'backup', key, id: days[1].id }); check('копия первого дня = 20', r.doc && r.doc.states.p1.earned === 20, r.doc && r.doc.states.p1.earned);
  r = await post({ op: 'backup', key, id: days[0].id }); check('копия второго дня = 30', r.doc && r.doc.states.p1.earned === 30);
  await post({ op: 'put', key, doc: Object.assign(doc(41), { email: 'mama@example.com', phone: '+7' }) });
  r = await post({ op: 'get', key }); check('лишние поля (почта, телефон) не хранятся', !('email' in r.doc) && !('phone' in r.doc), Object.keys(r.doc));
  r = await post({ op: 'put', key: 'нет', doc: doc(1) }); check('ключ — только хэш кода', r.status === 400);
  /* Неверные коды: 10 в час с одного адреса */
  const ip = '10.0.' + (Math.random() * 250 | 0) + '.' + (Math.random() * 250 | 0), codes = [];
  for (let i = 0; i < 10; i++) codes.push((await post({ op: 'join', key: hex(), _ip: ip })).status);
  check('10 неверных кодов — «такой семьи нет»', codes.every(c => c === 200), codes);
  r = await post({ op: 'join', key: hex(), _ip: ip }); check('11-й неверный код за час — отказ', r.status === 429, r.status);
  r = await post({ op: 'join', key, _ip: ip }); check('даже верный код с этого адреса — после паузы', r.status === 429);
  r = await post({ op: 'join', key, _ip: '10.200.0.1' }); check('с другого адреса верный код работает', r.status === 200 && !!r.doc);
  r = await post({ op: 'backups', key: hex(), _ip: ip }); check('список копий чужой семьи тоже ограничен', r.status === 429);
  await post({ op: 'dev_shift', days: 1 });
  r = await post({ op: 'join', key, _ip: ip }); check('через час снова можно', r.status === 200 && !!r.doc);
  await post({ op: 'dev_wipe' });
}

serverTests().catch(e => { results.fail++; log.push('ПРОВАЛ: облако — ' + e.message); }).finally(() => {
  window.RESULT = results;
  document.getElementById('out').innerHTML = `<b class="${results.fail ? 'bad' : 'ok'}">Проверок: ${results.pass + results.fail}, провалено: ${results.fail}${results.skip ? ' (облако не проверено)' : ''}</b>\n` + log.slice(0, 40).join('\n');
});
</script>
</body>
</html>
