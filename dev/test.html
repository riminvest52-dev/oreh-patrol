<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Тест генераторов</title>
<style>body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap}.bad{color:#b00}.task{border-bottom:1px solid #ddd;padding:6px 0}</style></head>
<body><h1>Тест генераторов</h1><div id="out"></div>
<script src="../js/core.js"></script><script src="../js/col.js"></script><script src="../js/t-fund.js"></script><script src="../js/t-lang.js"></script>
<script src="../js/t-models.js"></script><script src="../js/t-logic.js"></script><script src="../js/t-div.js"></script><script src="../js/t4a.js"></script><script src="../js/topics.js"></script><script src="../js/topics4.js"></script>
<script>const ACT = {}; const S = {};</script><script src="../js/t-vol.js"></script><script src="../js/mult.js"></script>
<script>
const strip = s => String(s).replace(/<[^>]+>/g, '');
function check(t) {
  const errs = [];
  if (!t) return ['null task'];
  const all = [t.q, t.hint].concat(t.explain || [], t.options || [], t.items || []).map(String).join(' | ');
  if (/undefined|NaN|null|\[object/.test(all)) errs.push('bad text: ' + all.slice(0, 200));
  if (!t.q) errs.push('no q');
  if (!t.hint) errs.push('no hint');
  if (!t.explain || !t.explain.length) errs.push('no explain');
  if (t.type === 'num') { if (!Number.isInteger(t.answer) || t.answer < 0) errs.push('bad num answer ' + t.answer); }
  else if (t.type === 'choice') {
    if (!t.options || t.options.length < 2) errs.push('few options');
    if (new Set(t.options).size !== t.options.length) errs.push('dup options');
    if (!t.options.includes(t.answer)) errs.push('answer not in options: ' + t.answer + ' / ' + t.options.join(' ; '));
    /* Ни один неверный вариант не равен ответу по значению (кроме lang_write — там проверяется запись) */
    if (t.gen !== 'lang_write') {
      const av = exprVal(t.answer);
      if (av !== null) for (const o of t.options) if (o !== t.answer && exprVal(o) === av) {
        errs.push('same value: ' + strip(o) + ' = ' + strip(t.answer) + ' = ' + av);
        VALDUP[t.gen] = (VALDUP[t.gen] || 0) + 1; if (VALDUPEX.length < 12) VALDUPEX.push(t.gen + ' d' + t.d + ': ' + strip(t.answer) + '  ≡  ' + strip(o) + ' = ' + av);
      }
    }
  } else if (t.type === 'multi') {
    if (!t.answer.length) errs.push('empty multi answer');
    if (t.answer.length === t.items.length) errs.push('all items correct');
    if (new Set(t.items).size !== t.items.length) errs.push('dup items');
    if (!t.answer.every(a => t.items.includes(a))) errs.push('answer not subset');
  } else if (t.type === 'build') {
    if (!t.check(t.sol)) errs.push('build: own solution rejected');
    if (t.check(t.sol.map(r => r.map(() => 0)))) errs.push('build: empty accepted');
  } else if (t.type === 'col') {
    /* «В столбик»: своё решение принимается, в строке ответа — ответ, неверная цифра ловится */
    if (!Number.isInteger(t.answer) || t.answer < 0) errs.push('bad col answer ' + t.answer);
    const sol = colSolution(t), r = colCheck(t, sol);
    if (!r.ok) errs.push('col: own solution rejected: ' + r.msg);
    if (colRowNum(t, sol, colResPred(t)) !== t.answer) errs.push('col: answer row ' + colRowNum(t, sol, colResPred(t)) + ' != ' + t.answer);
    const main = colOrder(t), k = R.pick(main), bad = Object.assign({}, sol); bad[k] = String((+(sol[k] || 0) + R.int(1, 8)) % 10);
    if (colCheck(t, bad).ok) errs.push('col: wrong digit accepted');
    const pos = new Set(); for (const c of t.lay.cells) { const key = c.r + ':' + c.c + (c.sm ? 's' : ''); if (pos.has(key)) errs.push('col: cells overlap ' + key); pos.add(key); }
  } else errs.push('bad type ' + t.type);
  if (t.optHtml && (t.optHtml.length !== t.options.length || new Set(t.optHtml).size !== t.optHtml.length)) errs.push('optHtml mismatch/dup');
  for (const x of t.traps || []) {
    if (String(x.v) === String(t.answer) || (t.type === 'num' && +x.v === t.answer)) errs.push('trap equals answer: ' + x.v);
    if (!x.msg || /undefined|NaN|null/.test(x.msg)) errs.push('bad trap msg: ' + x.msg);
    if (t.type === 'choice' && !t.options.includes(String(x.v))) TRAPMISS[t.gen] = (TRAPMISS[t.gen] || 0) + 1;
  }
  const txt = strip([t.q].concat(t.explain || [], (t.traps || []).map(x => x.msg)).join(' '));
  for (const m of txt.matchAll(/(\d+) (мешок|мешка|мешков|орех|ореха|орехов|гриб|гриба|грибов)(?![а-я])/g)) {
    const n = +m[1], w = m[2];
    const forms = w.startsWith('меш') ? ['мешок', 'мешка', 'мешков'] : w.startsWith('ор') ? ['орех', 'ореха', 'орехов'] : ['гриб', 'гриба', 'грибов'];
    if (pl(n, ...forms) !== w) PLURAL.push(t.gen + ': «' + m[0] + '» — ' + txt.slice(Math.max(0, m.index - 30), m.index + 30));
  }
  return errs;
}
const TRAPMISS = {}, PLURAL = [];
/* Значение варианта-выражения («45 − (12 + 6)»). null — если вариант не выражение (слова, буквы, картинки) */
function exprVal(o) {
  const s = strip(o).replace(/[  ]/g, ' ').trim();
  if (!/^[\d\s+\-−·:()]+$/.test(s) || !/\d/.test(s)) return null;
  try { const r = schoolSteps(s); return typeof r.value === 'number' && Number.isFinite(r.value) ? r.value : null; } catch (e) { return null; }
}
const VALDUP = {}, VALDUPEX = [];
const out = document.getElementById('out');
const summary = {}; let total = 0, fails = 0; const samples = [];
/* Оба мира: 5 класс и 4 класс */
const ALLT = TOPICS5.concat(TOPICS4); const REPEAT = {};
for (const top of ALLT) for (const g of top.gens) {
  if (!GEN[g]) { summary[g] = 'MISSING'; fails++; continue; }
  for (let d = 1; d <= 3; d++) {
    let f = 0, ex = null; const seen = {};
    for (let i = 0; i < 400; i++) {
      total++;
      let t, e;
      try { t = makeTask(g, d); e = check(t); } catch (err) { e = ['throw ' + err.message]; }
      if (e.length) { f++; fails++; if (!ex) ex = e.join('; '); }
      if (i < 2 && t) samples.push(`[${g} d${d}] ${strip(t.q)}\n  → ${t.type === 'multi' ? t.answer.join(', ') : t.answer}${t.options ? '   {' + t.options.join(' | ') + '}' : ''}${t.items ? '   items: ' + t.items.join(', ') : ''}\n  Разбор: ${t.explain.map(strip).join(' / ')}`);
    }
    summary[g + ' d' + d] = f ? `FAIL ${f}/400: ${ex}` : 'ok';
  }
}
/* Повторы внутри уровня 4 класса: 300 уровней по 10 задач на каждую ступень, как в игре (play.js перегенерирует до 8 раз) */
for (const top of TOPICS4) if (!top.act) for (let d = 1; d <= 3; d++) {
  let bad = 0;
  for (let l = 0; l < 300; l++) {
    const gens = []; while (gens.length < 10) gens.push(...R.shuffle(top.gens));
    const seen = new Set(), key = t => t.q + '|' + (t.options || []).join();
    for (const g of gens.slice(0, 10)) { let t = makeTask(g, d); for (let k = 0; k < 8 && seen.has(key(t)); k++) t = makeTask(g, d); if (seen.has(key(t))) { bad++; break; } seen.add(key(t)); }
  }
  if (bad) REPEAT[top.id + ' d' + d] = bad + '/300';
}
/* Доля заданий «из двух» (50/50) по каждой локации */
const share = {}; let two = 0, all = 0;
for (const top of ALLT) {
  let t2 = 0, n = 0;
  for (const g of top.gens) for (let d = 1; d <= 3; d++) for (let i = 0; i < 300; i++) { const t = makeTask(g, d); if (!t) continue; n++; if (t.type === 'choice' && t.options.length <= 2) t2++; }
  share[top.id] = Math.round(t2 / n * 1000) / 10; two += t2; all += n;
}
const share5050 = Math.round(two / all * 1000) / 10;
/* Остров правды: в одном задании нет строк одного шаблона (числа и x, y не считаем) */
const sig = s => strip(s).replace(/\b[xy]\b|\d+/g, '#').slice(0, 14);
const NEAR = [];
for (let d = 1; d <= 3; d++) for (let i = 0; i < 2000; i++) {
  const t = makeTask('log_tf', d);
  const lines = t.items || [...t.q.matchAll(/<li>(.*?)<\/li>/g)].map(m => m[1]);
  const sg = lines.map(sig);
  if (new Set(sg).size !== sg.length) NEAR.push(`d${d}: ` + lines.join(' | '));
}
/* Объёмная мастерская: развёртки и грани */
const VOLX = [];
if (HEXO.all.length !== 35 || HEXO.ok.length !== 11) VOLX.push('hexo ' + HEXO.all.length + '/' + HEXO.ok.length);
for (const cs of HEXO.all) for (const T of SYM8) if (!!foldNet(polyNorm(cs.map(T))) !== !!foldNet(cs)) VOLX.push('fold not symmetric ' + polyKey(cs));
{ const cross = [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]], f = foldNet(cross), opp = (a, b) => (f[a] ^ 1) === f[b];
  if (!opp(1, 3) || !opp(2, 4) || !opp(0, 5)) VOLX.push('cross opposite wrong ' + f); }
for (let i = 0; i < 300; i++) { const H = stairs(3, 3, 0, 4, 26); if (H && viewTop(H).flat().length !== 9) VOLX.push('top size'); }
/* Сколько заданий генератор выдал бы с «вариантом того же значения» без перегенерации (makeTask их отбрасывает) */
const RAWDUP = {};
for (const top of ALLT) for (const g of top.gens) if (GEN[g]) for (let d = 1; d <= 3; d++) {
  let n = 0; for (let i = 0; i < 2000; i++) { let t; try { t = GEN[g].f(d); } catch (e) { continue; } if (!t) continue; t.gen = g; if (sameValueOpt(t)) n++; }
  if (n) RAWDUP[g + ' d' + d] = n + '/2000';
}
window.TEST = { repeat: REPEAT, rawdup: RAWDUP, valdup: VALDUP, valdupEx: VALDUPEX, volx: VOLX, total, fails, summary, share5050, share, near: NEAR.length, nearEx: NEAR.slice(0, 5), plural: PLURAL.slice(0, 20), pluralN: PLURAL.length, trapMiss: TRAPMISS };
out.innerHTML = `<p><b>${total}</b> заданий, ошибок: <b class="${fails ? 'bad' : ''}">${fails}</b>. Уровней 4 класса с повтором задачи: ${JSON.stringify(REPEAT)}. Заданий «из двух» (50/50): ${share5050}% (${Object.entries(share).map(([k, v]) => TOPIC[k].name + ' ' + v + '%').join(', ')}). Остров правды, строк одного шаблона в задании: ${NEAR.length}. Подозрительных склонений: ${PLURAL.length}</p><pre>${PLURAL.slice(0, 20).join(String.fromCharCode(10))}</pre><pre>${Object.entries(summary).map(([k, v]) => k + ': ' + v).join('\n')}</pre><h2>Примеры</h2>` +
  samples.map(s => `<div class="task"><pre>${s.replace(/</g, '&lt;')}</pre></div>`).join('');
</script></body></html>
